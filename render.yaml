services:
  # Express API — auth, pressure engine, substitution, budget, the trust
  # vertical (visits/community/offers/waitlist/alerts/businesses/safety),
  # trips.
  - type: web
    name: sahyatri-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set for real in the Render dashboard, not here -- these are secrets
      # or deployment-specific URLs, not values with a safe repo default.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false # the deployed Vercel URL (add localhost too, comma-separated, if testing this backend from a local frontend)
      # Internal-service auth (serviceAuth.middleware.js's protectRouteOrService):
      # ai-service authenticates its server-to-server calls into this backend
      # (trip drafts, group-trip tools, preference reads) with this token in an
      # X-Internal-Service-Token header instead of a session cookie, since it has
      # no browser session to send. Must be set to the SAME value as
      # sahyatri-ai-service's own INTERNAL_SERVICE_TOKEN below, or every one of
      # those calls silently falls back to cookie auth and 401s.
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # Base URL of the deployed sahyatri-ai-service, e.g.
      # https://sahyatri-ai-service.onrender.com -- without this,
      # demandML.provider.js falls back to its http://localhost:8000 default,
      # which does not exist on Render, and pressure demand-ML predictions
      # silently degrade to the non-ML baseline.
      - key: AI_SERVICE_URL
        sync: false
      # Full URL including path, e.g.
      # https://sahyatri-ai-service.onrender.com/onboarding/extract -- without
      # this, WhatsApp onboarding field extraction fails outright (falls back
      # to the same nonexistent localhost:8000 default).
      - key: EXTRACT_SERVICE_URL
        sync: false
      # Full URL including path, e.g.
      # https://sahyatri-ai-service.onrender.com/onboarding/transcribe --
      # same failure mode as EXTRACT_SERVICE_URL above if left unset.
      - key: TRANSCRIBE_SERVICE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RAILRADAR_API_KEY
        sync: false
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # FastAPI agent orchestrator (Google ADK) -- POST /api/plan-trip and
  # /api/plan-trip/confirm. Separate service from the Express API by design
  # (see ai-service/app/main.py); needs its own deploy and its own URL.
  - type: web
    name: sahyatri-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CLIENT_URL
        sync: false # same value as the backend's CLIENT_URL
      - key: BACKEND_URL
        sync: false # the deployed sahyatri-backend URL, e.g. https://sahyatri-backend.onrender.com
      # Must be set to the SAME value as sahyatri-backend's own
      # INTERNAL_SERVICE_TOKEN above -- see that entry's comment.
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      # Trip planning falls through Groq -> Mistral -> Gemini in that order
      # (app/agents/travel_agent.py's PROVIDER_CHAIN), skipping whichever of
      # these are left blank. Groq is primary -- Gemini is a last-resort
      # fallback, off by default (blank GOOGLE_API_KEY), after repeatedly
      # hitting its free tier's 20-calls/day quota during this feature's own
      # testing. Groq is groq.com (fast inference hosting), not xAI's "Grok"
      # model -- a different product/account despite the near-identical name.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: groq/qwen/qwen3.8-27b
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral/mistral-small-latest
      - key: GOOGLE_API_KEY
        value: ""
      - key: MODEL
        value: gemini-2.5-flash
